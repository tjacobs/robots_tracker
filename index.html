<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f5f7" />
  <title>Robots</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>Robots</h1>
        <div class="subtitle">ROBOT INDUSTRY TRACKER · U.S. home / light industrial robots</div>
      </div>
      <div class="updated">UPDATED OCT 13, 2026</div>
    </header>

    <nav class="tabs" aria-label="Metric">
      <button class="tab active" data-metric="robotsDeployed">ROBOTS DEPLOYED</button>
      <button class="tab" data-metric="robotsBuilt">ROBOTS BUILT</button>
      <button class="tab" data-metric="monthsSinceLaunch">MONTHS DEPLOYED</button>
      <button class="tab" data-metric="price">PRICE</button>
      <button class="tab" data-metric="funding">FUNDING</button>
    </nav>

    <div class="metric-note" aria-live="polite"></div>
    <section class="chart-card">
      <div id="groups"></div>
    </section>
  </main>

  <div id="drawerRoot"></div>
  <script src="app.js"></script>
</body>
</html>
